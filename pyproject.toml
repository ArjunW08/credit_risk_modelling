[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-modelling"
version = "0.1.0"
description = "Credit risk modelling prototype for predicting loan approval outcomes using customer credit bureau and internal product data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<2",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "sqlalchemy>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "xgboost>=2.0,<3",
    "streamlit>=1.30,<2",
    "joblib>=1.3,<2",
    "openpyxl>=3.1,<4",
]

[tool.setuptools]
# No Python packages to install. This project is a collection of scripts,
# not an importable library. Dependencies are the only thing we need.
packages = []
